[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-stargaze"
version = "0.1.0"
description = "Causal multi-exchange BTC microstructure modeling pipeline."
requires-python = ">=3.12"
dependencies = [
  "ctrader-open-api>=0.9.2",
  "numpy>=2.2",
  "pyarrow>=19.0",
  "polars>=1.28",
  "torch>=2.7",
  "scipy>=1.15",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
stargaze-ml = "stargaze_ml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_collector*", "stargaze_ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
