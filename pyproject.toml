[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-stargaze"
version = "0.1.0"
description = "Causal L2/VWAP market-microstructure research pipeline."
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9",
  # Install the official cTrader client with tools/install_ctrader_secure.py;
  # its wheel pins vulnerable transitive versions.
  "inputimeout>=1.0.4",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.2",
  "Pillow>=10.0",
  "pyarrow>=19.0",
  "polars>=1.28",
  "pystray>=0.19",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "protobuf>=6.33.5,<8",
  "pyOpenSSL>=26.0.0,<27",
  "requests>=2.33.0,<3",
  "service-identity>=24.2.0",
  "torch>=2.7",
  "Twisted>=26.4.0,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
stargaze-ml = "stargaze_ml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_collector*", "stargaze_ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
